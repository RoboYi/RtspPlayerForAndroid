plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseSigningFile = rootProject.file('release-signing.properties')
def releaseSigning = new Properties()
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}
def requiredSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def hasReleaseSigning = requiredSigningKeys.every { releaseSigning.getProperty(it)?.trim() }
if (releaseSigningFile.isFile() && !hasReleaseSigning) {
    throw new GradleException('release-signing.properties must contain storeFile, storePassword, keyAlias and keyPassword')
}

android {
    namespace 'com.roboyi.rtspdemo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.roboyi.rtspdemo'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.0.1-Beta'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        buildConfigField 'String', 'ROBOYI_LICENSE', '"RYL4.prod-2026-01..MEYCIQDtlvrIyQa52jFiuU2GbwrzMjur7okMI2NR-cdkzJeDSwIhAIcNScsxBUmhiQ6mPOMxIjuJTrcIN6X9rQzp3p9co2sZ"'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile rootProject.file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    packaging {
        jniLibs { pickFirsts += ['**/libc++_shared.so'] }
    }
}


// ... existing code ...

android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'release') {
        variant.outputs.all { output ->
            def versionName = variant.versionName
            outputFileName = "RoboYiPlayer-${versionName}.apk"
        }
    }
}

dependencies {
    implementation project(':domain')
    implementation project(':data')
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation files('libs/roboyiplayer-core-avc-hevc-release-discovery-V1.0.1-Beta.aar')
    implementation files('libs/roboyiplayer-transport-gstreamer-avc-hevc-release-V1.0.1-Beta.aar')
}
