plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseSigningFile = rootProject.file('release-signing.properties')
def releasePolicyFile = rootProject.file('release-policy.properties')
def releaseLicenseFile = rootProject.file('release-license.properties')
def releaseSigning = new Properties()
def releasePolicy = new Properties()
def releaseLicense = new Properties()
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}
if (releasePolicyFile.isFile()) {
    releasePolicyFile.withInputStream { releasePolicy.load(it) }
}
if (releaseLicenseFile.isFile()) {
    releaseLicenseFile.withInputStream { releaseLicense.load(it) }
}
def privacyOperator = releasePolicy.getProperty('privacyOperator', '').trim()
def privacyPolicyUrl = releasePolicy.getProperty('privacyPolicyUrl', '').trim()
def privacyContactEmail = releasePolicy.getProperty('privacyContactEmail', '').trim()
def privacyPolicyVersion = releasePolicy.getProperty('privacyPolicyVersion', '').trim()
def releaseLicenseKey = releaseLicense.getProperty('licenseKey', '').trim()
def releaseLicensePublicKeyFile = releaseLicense.getProperty('publicKeyFile', '').trim()
def signingStoreFile = releaseSigning.getProperty('storeFile', '').trim()
def signingKeyAlias = releaseSigning.getProperty('keyAlias', '').trim()
def signingStorePassword = providers.environmentVariable('ROBOYI_RELEASE_STORE_PASSWORD').orNull ?:
    releaseSigning.getProperty('storePassword', '')
def signingKeyPassword = providers.environmentVariable('ROBOYI_RELEASE_KEY_PASSWORD').orNull ?:
    releaseSigning.getProperty('keyPassword', '')
def hasReleaseSigning = signingStoreFile && signingKeyAlias &&
    signingStorePassword && signingKeyPassword
// Keep this identical to the version suffix of both rebuilt SDK AAR files.
def sdkArtifactVersion = 'V1.0.4-Beta'
def sdkCoreAar = file("libs/roboyiplayer-core-avc-hevc-release-discovery-${sdkArtifactVersion}.aar")
def sdkTransportAar = file("libs/roboyiplayer-transport-gstreamer-avc-hevc-release-${sdkArtifactVersion}.aar")
def sdkCameraPushAar = file("libs/roboyiplayer-camera-push-release-${sdkArtifactVersion}.aar")
android {
    namespace 'com.roboyi.rtspdemo'
    compileSdk 36

    defaultConfig {
        applicationId 'com.roboyi.rtspplayer'
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName '1.0.4-Beta'
        testInstrumentationRunner 'com.roboyi.rtspdemo.InspectionSmokeInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        buildConfigField 'String', 'ROBOYI_LICENSE', '"RYL4.prod-2026-01..MEUCIQCNE9hLh764cVpc5HGSzu5kNC1wLr4t8cwcyqndZqKRnwIgf38dmw97YmPeUIWfrPQeVEObrlmA7izDGrlS-nL1JiM"'
        buildConfigField 'String', 'PRIVACY_OPERATOR', groovy.json.JsonOutput.toJson(privacyOperator)
        buildConfigField 'String', 'PRIVACY_POLICY_URL', groovy.json.JsonOutput.toJson(privacyPolicyUrl)
        buildConfigField 'String', 'PRIVACY_CONTACT_EMAIL', groovy.json.JsonOutput.toJson(privacyContactEmail)
        buildConfigField 'String', 'PRIVACY_POLICY_VERSION', groovy.json.JsonOutput.toJson(privacyPolicyVersion ?: 'debug-policy-v1')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile rootProject.file(signingStoreFile)
                if (releaseSigning.getProperty('storeType')?.trim()) {
                    storeType releaseSigning.getProperty('storeType').trim()
                }
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            if (releaseLicenseKey) {
                buildConfigField 'String', 'ROBOYI_LICENSE', groovy.json.JsonOutput.toJson(releaseLicenseKey)
            }
        }
    }

    packaging {
        jniLibs { pickFirsts += ['**/libc++_shared.so'] }
    }
}


// ... existing code ...

android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'release') {
        variant.outputs.all { output ->
            def versionName = variant.versionName
            outputFileName = "RoboYiPlayer-${versionName}.apk"
        }
    }
}

dependencies {
    implementation project(':domain')
    implementation project(':data')
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation files(sdkCoreAar)
    implementation files(sdkTransportAar)
    implementation files(sdkCameraPushAar)
}

tasks.register('verifyReleaseNativePageSize', Exec) {
    group = 'verification'
    description = 'Require 16 KB-compatible arm64 libraries in the shipping SDK.'
    commandLine 'python', rootProject.file('tools/check_native_page_size.py'),
        sdkTransportAar
}
tasks.register('verifyReleasePolicy') {
    group = 'verification'
    description = 'Require the real publishing entity and a public HTTPS privacy policy URL.'
    doLast {
        def url = null
        try { url = new URI(privacyPolicyUrl) } catch (Exception ignored) { }
        if (!privacyOperator || url == null || url.scheme != 'https' ||
            !url.host || url.userInfo || privacyPolicyUrl.contains('<') ||
            !(privacyContactEmail ==~ /^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/) ||
            !(privacyPolicyVersion ==~ /^\d{4}-\d{2}-\d{2}(?:-[A-Za-z0-9]+)?$/)) {
            throw new GradleException('Set privacyOperator, a public HTTPS privacyPolicyUrl, privacyContactEmail and privacyPolicyVersion in release-policy.properties')
        }
    }
}
tasks.register('verifyReleaseLicense') {
    group = 'verification'
    description = 'Require a separately issued production license for release builds.'
    doLast {
        def valid = false
        try {
            def parts = releaseLicenseKey.split('\\.')
            if (parts.length == 4 && parts[0] == 'RYL4' && parts[1].startsWith('prod-')) {
                def payload = new groovy.json.JsonSlurper().parseText(
                    new String(java.util.Base64.getUrlDecoder().decode(parts[2]), 'UTF-8'))
                def keyFile = rootProject.file(releaseLicensePublicKeyFile)
                def publicKey = java.security.KeyFactory.getInstance('EC').generatePublic(
                    new java.security.spec.X509EncodedKeySpec(java.nio.file.Files.readAllBytes(keyFile.toPath())))
                def signature = java.security.Signature.getInstance('SHA256withECDSA')
                signature.initVerify(publicKey)
                signature.update(parts.take(3).join('.').getBytes('UTF-8'))
                def signed = signature.verify(java.util.Base64.getUrlDecoder().decode(parts[3]))
                // The configured issuer must be the same key compiled into the shipped Core AAR.
                def ringEntry = "${parts[1]}:${java.util.Base64.getEncoder().encodeToString(java.nio.file.Files.readAllBytes(keyFile.toPath()))}"
                def issuerInSdk = false
                new java.util.zip.ZipFile(sdkCoreAar).withCloseable { aar ->
                    def classes = aar.getEntry('classes.jar')
                    if (classes != null) {
                        new java.util.zip.ZipInputStream(aar.getInputStream(classes)).withCloseable { jar ->
                            def entry
                            while ((entry = jar.nextEntry) != null) {
                                if (entry.name == 'com/roboyi/rtsp/BuildConfig.class') {
                                    issuerInSdk = new String(jar.bytes, 'ISO-8859-1').contains(ringEntry)
                                    break
                                }
                            }
                        }
                    }
                }
                def nowSeconds = System.currentTimeMillis().intdiv(1000)
                valid = !payload.licenseId?.toString()?.startsWith('demo-') &&
                    payload.packageNames?.contains('com.roboyi.rtspplayer') &&
                    payload.applicationLabel == 'RtspPlayer' &&
                    payload.codecScope == 'AVC_HEVC' &&
                    payload.features?.containsAll(['PLAYBACK', 'RECORDING', 'RTSP_PUSH', 'SCREENSHOT']) &&
                    payload.expiresAt instanceof Number &&
                    (payload.expiresAt >= 4102444800L || payload.expiresAt > nowSeconds) &&
                    signed && issuerInSdk
            }
        } catch (Exception ignored) { }
        if (!valid) throw new GradleException(
            'Set a signed non-demo RYL4 license whose issuer is embedded in the Core AAR, for com.roboyi.rtspplayer / RtspPlayer / AVC_HEVC with PLAYBACK, RECORDING, RTSP_PUSH and SCREENSHOT in release-license.properties')
    }
}
tasks.register('verifyReleaseSigning') {
    group = 'verification'
    description = 'Require a configured release signing key.'
    doLast {
        if (!hasReleaseSigning || !rootProject.file(signingStoreFile).isFile()) throw new GradleException(
            'Configure an existing signing store, alias and passwords (or ROBOYI_RELEASE_*_PASSWORD) before producing a store release')
    }
}
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') task.dependsOn(
        'verifyReleaseNativePageSize', 'verifyReleasePolicy',
        'verifyReleaseLicense', 'verifyReleaseSigning')
}
